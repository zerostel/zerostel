# Keeps the pinned GitHub Actions and the dev dependencies current. Zerostel
# has no runtime dependencies, so these only touch CI and the build.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # TypeScript 7 is a rewrite the bundler isn't ready for, and the Node
      # types should match the oldest Node Zerostel supports
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker
    directory: /docs/demo
    schedule:
      interval: monthly
