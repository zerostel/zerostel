name: CI

on:
  push:
    branches: [main]
    # the website and the docs don't change what the tests test
    paths-ignore: ['site/**', 'docs/**', '**/*.md', 'assets/**']
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run every OS and Node version, even while the repository is private
        type: boolean
        default: false

permissions:
  contents: read

# a newer push to the same branch makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      # Public repositories run free, so they get every OS and Node version. A
      # private one bills by the minute, macOS at 10x and Windows at 2x, so it
      # runs Linux on every Node version plus one Windows job.
      matrix:
        include: ${{ fromJSON(github.event.repository.private && !inputs.full && '[{"os":"ubuntu-latest","node":20},{"os":"ubuntu-latest","node":22},{"os":"ubuntu-latest","node":24},{"os":"ubuntu-latest","node":26},{"os":"windows-latest","node":22}]' || '[{"os":"ubuntu-latest","node":20},{"os":"ubuntu-latest","node":22},{"os":"ubuntu-latest","node":24},{"os":"ubuntu-latest","node":26},{"os":"macos-latest","node":20},{"os":"macos-latest","node":22},{"os":"macos-latest","node":24},{"os":"macos-latest","node":26},{"os":"windows-latest","node":20},{"os":"windows-latest","node":22},{"os":"windows-latest","node":24},{"os":"windows-latest","node":26}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # the test runner needs Node 22.12+; on Node 20 we check what users run: the bundle
      - run: npm run typecheck
        if: matrix.node != 20
      - run: npm test
        if: matrix.node != 20
      - run: npm run build
      - run: node dist/cli.js --version
      - run: node scripts/smoke.mjs
      # the executable with Node inside, built once per run
      - run: node scripts/standalone.mjs
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
