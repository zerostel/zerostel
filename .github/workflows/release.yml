name: Release

# Runs only when a maintainer pushes a tag like v0.1.0 on a commit that is
# already on main.
#
# Zerostel ends up inside every user's agent hooks, so a hijacked release is
# the worst thing that can happen to it. The build job runs the dev
# dependencies (tests, bundler) but holds no secrets. The publish job runs no
# project code and holds no npm token either: npm trusted publishing gives it a
# short-lived credential for this repository, this workflow and the `npm`
# environment only, and that credential can only stage the built tarball. The
# release goes live when a maintainer approves it on npm with two-factor
# authentication. The `npm` environment also requires a reviewer (repo
# Settings → Environments). Actions are pinned to commit SHAs.

on:
  push:
    # release tags only, not the moving v0 tag the GitHub Action is used by
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Tag is on main and matches package.json
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/smoke.mjs
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball
          path: zerostel-*.tgz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm is new enough for staged publishing (11.15.0)
        run: test "$(printf '11.15.0\n%s\n' "$(npm --version)" | sort -V | head -n1)" = 11.15.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
      # goes live once a maintainer approves it on npmjs.com (Staged Packages) with 2FA
      - run: npm stage publish zerostel-*.tgz --provenance --access public --ignore-scripts

  manifests:
    # From the staged tarball: npm serves these same bytes once the release is
    # approved. No secrets here.
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
      - name: Homebrew formula and Scoop manifest
        run: node scripts/release-manifests.mjs "${GITHUB_REF_NAME#v}" "zerostel-${GITHUB_REF_NAME#v}.tgz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-manifests
          path: packaging/out/

  standalone:
    # Executables with Node inside, for machines without Node. Built from the
    # same commit after the tests passed; no secrets here.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: windows-latest, target: win-x64 }
          - { os: windows-11-arm, target: win-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: node scripts/standalone.mjs
      - name: Archive
        if: runner.os != 'Windows'
        run: tar -C build/standalone -czf "build/zerostel-${GITHUB_REF_NAME#v}-$TARGET.tar.gz" zerostel
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/standalone/zerostel.exe -DestinationPath "build/zerostel-$($env:GITHUB_REF_NAME.Substring(1))-$env:TARGET.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-${{ matrix.target }}
          path: build/zerostel-*
          if-no-files-found: error

  release-assets:
    # Signs where each executable came from and puts them in a draft release.
    # Runs no project code; a maintainer reviews the draft and publishes it.
    needs: [standalone, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the draft release
      id-token: write # signing the attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: standalone-*
          merge-multiple: true
          path: assets
      - name: Exactly the expected files
        # nothing gets signed or released that the six builds weren't meant to make
        run: |
          v="${GITHUB_REF_NAME#v}"
          cd assets
          expected="zerostel-$v-darwin-arm64.tar.gz zerostel-$v-darwin-x64.tar.gz zerostel-$v-linux-arm64.tar.gz zerostel-$v-linux-x64.tar.gz zerostel-$v-win-arm64.zip zerostel-$v-win-x64.zip"
          test "$(ls -1 | sort | tr '\n' ' ' | sed 's/ $//')" = "$expected" || { echo "unexpected files:"; ls -la; exit 1; }
      - name: Checksums
        run: cd assets && sha256sum zerostel-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/zerostel-*
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* --draft --verify-tag --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Changes: see CHANGELOG.md. The executables have Node inside. Check where one came from with: gh attestation verify <file> --repo $GITHUB_REPOSITORY"
